<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meanwhile — register your payout email</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --bg:#07070a; --panel:rgba(255,255,255,0.04); --border:rgba(255,255,255,0.08);
    --text:#f5f0e6; --muted:#8c8c96; --green:#7ee787;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:radial-gradient(ellipse 70% 40% at 50% -10%, rgba(232,200,150,.08), transparent), var(--bg);
         color:var(--text); font-family:'Inter',-apple-system,sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; }
  .wrap { max-width:480px; margin:0 auto; padding:90px 24px; }
  h1 { font-family:'Fraunces',serif; font-size:28px; font-weight:600; margin-bottom:10px; }
  .sub { color:var(--muted); font-size:14px; line-height:1.6; margin-bottom:32px; }
  .id-box { background:rgba(0,0,0,.4); border:1px solid var(--border); border-radius:8px; padding:10px 12px;
            font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); margin-bottom:24px; word-break:break-all; }

  .balance-card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:22px 24px; margin-bottom:28px; }
  .balance-card .amount { font-family:'JetBrains Mono',monospace; font-size:32px; font-weight:700; color:#e8c896; }
  .balance-card .lbl { font-size:12px; color:var(--muted); margin-top:2px; }
  .progress-track { height:6px; background:rgba(255,255,255,.08); border-radius:100px; margin-top:16px; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg,#f2b134,#ec4899); border-radius:100px; transition:width .6s ease; }
  .progress-note { font-size:11px; color:var(--muted); margin-top:8px; }

  form { display:flex; flex-direction:column; gap:14px; background:var(--panel); border:1px solid var(--border);
         border-radius:14px; padding:24px; }
  label { font-size:12px; color:var(--muted); margin-bottom:6px; display:block; }
  input { width:100%; background:rgba(0,0,0,.4); border:1px solid var(--border); border-radius:8px;
          padding:11px 13px; color:var(--text); font-size:14px; font-family:inherit; }
  input:focus { outline:none; border-color:#e8c896; }
  button { background:linear-gradient(135deg,#e8c896,#d99a9a); color:#1a1408; border:none; border-radius:8px;
           padding:13px; font-weight:700; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .status { font-size:13px; min-height:18px; }
  .status.ok { color:var(--green); }
  .status.err { color:#e77; }
  .note { font-size:11px; color:var(--muted); margin-top:14px; line-height:1.5; }
  .no-id { text-align:center; color:var(--muted); font-size:14px; padding:40px 0; }
  .no-id code { background:rgba(255,255,255,.06); padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const params = new URLSearchParams(location.search);
const id = params.get('id');
const app = document.getElementById('app');
const THRESHOLD = 25;

if (!id) {
  app.innerHTML = `
    <h1>No install ID found</h1>
    <div class="no-id">Run <code>python3 statusline.py --claim</code> in your terminal to get your personal link.</div>
  `;
} else {
  app.innerHTML = `
    <h1>Register your payout email</h1>
    <p class="sub">Tied to your anonymous install, nothing else. Once your balance crosses $${THRESHOLD}, you're included in the next monthly payout.</p>
    <div class="id-box">${id}</div>
    <div class="balance-card" id="balanceCard">
      <div class="amount" id="amount">–</div>
      <div class="lbl">current balance</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-note" id="progressNote">loading…</div>
    </div>
    <form id="claimForm">
      <div>
        <label for="email">PayPal email</label>
        <input id="email" type="email" placeholder="you@example.com" required>
      </div>
      <button type="submit" id="submitBtn">Register for payout</button>
      <div id="status" class="status"></div>
    </form>
    <p class="note">Payouts are batched monthly, manually, to registered emails once a balance crosses $${THRESHOLD}. We're pre-launch — there's no real balance to pay out yet, but this is the real mechanism that will be used once there is.</p>
  `;

  async function loadBalance() {
    try {
      const res = await fetch(`https://deadtime-server.bean-picker.workers.dev/earnings?id=${id}`);
      const s = await res.json();
      const amt = s.user_earnings || 0;
      document.getElementById('amount').textContent = '$' + amt.toFixed(2);
      const pct = Math.min(100, (amt / THRESHOLD) * 100);
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressNote').textContent =
        amt >= THRESHOLD ? 'threshold reached — included in next payout' : `$${(THRESHOLD - amt).toFixed(2)} to go until payout`;
      if (s.payout_email) {
        document.getElementById('email').value = s.payout_email;
      }
    } catch (e) {
      document.getElementById('progressNote').textContent = 'could not reach server';
    }
  }
  loadBalance();

  document.getElementById('claimForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const status = document.getElementById('status');
    const email = document.getElementById('email').value.trim();
    btn.disabled = true;
    btn.textContent = 'Registering…';
    try {
      const res = await fetch('https://deadtime-server.bean-picker.workers.dev/register-payout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, email }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'failed');
      status.textContent = `Registered — payouts will go to ${email} once you cross $${THRESHOLD}.`;
      status.className = 'status ok';
    } catch (err) {
      status.textContent = 'Something went wrong — check the email and try again.';
      status.className = 'status err';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Register for payout';
    }
  });
}
</script>
</body>
</html>
