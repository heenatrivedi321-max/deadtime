<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meanwhile — your dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,100..900&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --bg:#07070a; --panel:rgba(255,255,255,0.045); --panel-2:rgba(255,255,255,0.07); --border:rgba(255,255,255,0.1);
    --text:#f5f0e6; --muted:#8c8c96; --green:#3fb968; --gold:#e8c896;
    --pp-dark:#003087; --pp-light:#0070ba; --pp-glow:#2a9bf0;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,sans-serif;
         -webkit-font-smoothing:antialiased; min-height:100vh; overflow-x:hidden; }

  .aurora { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .blob { position:absolute; border-radius:50%; filter:blur(100px); opacity:.26; mix-blend-mode:screen; }
  .b1 { width:420px; height:420px; background:#a855f7; top:-150px; right:-130px; animation:float1 24s ease-in-out infinite; }
  .b2 { width:380px; height:380px; background:#14c9a5; top:40%; left:-140px; animation:float2 28s ease-in-out infinite; }
  .b3 { width:360px; height:360px; background:#f2b134; bottom:-140px; right:10%; animation:float3 30s ease-in-out infinite; }
  @keyframes float1 { 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-50px,70px) scale(1.1); } }
  @keyframes float2 { 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(60px,40px) scale(.92); } }
  @keyframes float3 { 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-40px,-50px) scale(1.08); } }

  .wrap { position:relative; z-index:1; max-width:1040px; margin:0 auto; padding:56px 24px 80px; }
  .intro-col { max-width:460px; }
  /* auto-fit reflows the row on its own as space shrinks -- 4 cards wide
     on desktop, 2, then 1 on a phone -- instead of one fixed breakpoint
     that collapses everything to a stack at once. */
  .dashboard-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
                     gap:18px; align-items:start; margin-top:8px; }
  .dashboard-grid > * { min-width:0; }
  .span-all { grid-column:1 / -1; }
  .dashboard-footer { max-width:460px; margin-top:0; }

  .brand { display:flex; align-items:center; gap:10px; margin-bottom:36px; text-decoration:none; color:inherit; width:fit-content; }
  .brand img { width:28px; height:28px; }
  .brand span { font-family:'Fraunces',serif; font-size:16px; font-weight:600; }

  .secure-badge { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--green);
                   background:rgba(63,185,104,.1); border:1px solid rgba(63,185,104,.25);
                   padding:5px 12px; border-radius:100px; margin-bottom:20px; }

  /* permanent, not a decoration -- this number never changes once
     assigned, so it gets its own distinct gold identity instead of
     blending into the green "secured" badge above it. */
  .promo-badge { display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; color:var(--gold);
                    background:linear-gradient(120deg, rgba(232,200,150,.16), rgba(242,177,52,.08));
                    border:1px solid rgba(232,200,150,.4); padding:7px 14px; border-radius:100px;
                    margin-top:2px; margin-bottom:8px; text-shadow:0 0 14px rgba(232,200,150,.35); }
  .promo-badge .fb-dot { width:6px; height:6px; border-radius:50%; background:var(--gold);
                            box-shadow:0 0 8px rgba(232,200,150,.8); flex-shrink:0; }

  h1 { font-family:'Fraunces',serif; font-size:27px; font-weight:600; margin-bottom:8px; letter-spacing:-0.01em;
       background:linear-gradient(100deg,#f2b134,#f0654a,#ec4899,#a855f7,#3b82f6,#14c9a5,#f2b134);
       background-size:180% auto; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
       animation:shimmer 8s linear infinite; }
  @keyframes shimmer { to { background-position:180% center; } }
  .sub { color:var(--muted); font-size:14px; line-height:1.6; margin-bottom:28px; }

  /* ---- real glass, same engine as the campaign dashboard: an SVG
     displacement-map filter for genuine edge refraction (not a fake
     blur+tint), a motion-lagged specular highlight, and content-adaptive
     tint sampled from this page's own aurora blobs. Applied to every
     card that isn't the hero balance/electric-border, which keeps its
     own distinct signature look on purpose. .flash fires only from a
     real new-line-shown event (see loadBalance()), not a timer. ---- */
  .glass-panel { position:relative; overflow:hidden;
    background:linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.03));
    backdrop-filter:blur(22px) saturate(170%); -webkit-backdrop-filter:blur(22px) saturate(170%);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 16px 36px -22px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.14), inset 0 1px 0 rgba(255,255,255,.4);
    transition:transform .35s cubic-bezier(.16,1,.3,1), box-shadow .35s ease, border-color .25s ease; }
  .glass-panel::after { content:''; position:absolute; inset:0; pointer-events:none; z-index:2; border-radius:inherit;
    background:radial-gradient(circle at var(--mx,50%) var(--my,15%), rgba(255,255,255,.3), transparent 62%);
    opacity:.5; mix-blend-mode:overlay; transition:opacity .3s ease; }
  .glass-panel:hover::after { opacity:.85; }
  .glass-panel.flash { border-color:rgba(232,200,150,.65);
    box-shadow:0 16px 36px -22px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.14),
               inset 0 1px 0 rgba(255,255,255,.4), 0 0 34px -4px rgba(232,200,150,.5); }
  @media (prefers-reduced-motion: reduce) { .glass-panel::after { display:none; } }

  /* real press response -- glass compresses and brightens on actual
     pointer-down, springs back on release, same recipe used site-wide. */
  button, .cmd-box button { transition:transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .15s ease, background .2s ease, filter .15s ease; }
  button:active, .cmd-box button:active { transform:scale(.94) !important; filter:brightness(1.15); transition:transform .08s ease, filter .08s ease; }

  /* ---- destination card: where the money actually goes ---- */
  .destination { display:flex; align-items:center; gap:16px;
                  border-radius:14px; padding:18px 20px; margin-bottom:20px; }
  .pp-badge-wrap { position:relative; width:54px; height:54px; flex-shrink:0; }
  .pp-badge { width:54px; height:54px; border-radius:50%; background:#ffffff;
              display:flex; align-items:center; justify-content:center; position:relative; z-index:2;
              box-shadow:0 0 0 rgba(42,155,240,0); transition:box-shadow .5s ease, transform .4s cubic-bezier(.34,1.56,.64,1); }
  .pp-badge img { width:28px; height:auto; }
  .pp-badge.pulse { animation:ppPulse .7s ease; box-shadow:0 0 30px 6px rgba(42,155,240,.5); }
  @keyframes ppPulse { 0%{ transform:scale(1); } 35%{ transform:scale(1.18); } 100%{ transform:scale(1); } }
  .pp-ring { position:absolute; inset:-6px; border-radius:50%; border:2px solid var(--pp-glow); opacity:0;
             z-index:1; pointer-events:none; }
  .pp-ring.expand { animation:ppRing .8s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes ppRing { 0%{ opacity:.8; transform:scale(.6); } 100%{ opacity:0; transform:scale(2.2); } }
  .pp-ring-idle { position:absolute; inset:-6px; border-radius:50%; border:1.5px solid rgba(42,155,240,.4);
                  z-index:1; pointer-events:none; animation:ppIdle 2.8s ease-out infinite; }
  @keyframes ppIdle { 0%{ transform:scale(.85); opacity:.7; } 100%{ transform:scale(1.5); opacity:0; } }
  .dest-text .dest-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .dest-text .dest-value { font-size:15px; font-weight:600; margin-top:2px; }
  .dest-text .dest-note { font-size:12px; color:var(--muted); margin-top:2px; }

  /* the traveling orb, animated via JS along a path to the badge */
  .orb { position:fixed; width:10px; height:10px; border-radius:50%; background:var(--gold);
         box-shadow:0 0 12px 3px rgba(224,176,84,.7); pointer-events:none; z-index:80; opacity:0; }

  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px 22px; margin-bottom:20px; }
  .card-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  .id-value { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); word-break:break-all; }

  .balance-card { background:linear-gradient(180deg, var(--panel-2), var(--panel)); border:1px solid var(--border);
                   border-radius:16px; padding:30px 26px; margin-bottom:20px; }
  .balance-card .amount { font-family:'JetBrains Mono',monospace; font-size:56px; font-weight:700; color:var(--text); line-height:1; }
  .balance-card .lbl { font-size:12px; color:var(--muted); margin-top:6px; }
  .balance-breakdown { font-size:12.5px; color:var(--muted); margin-top:10px; display:flex; align-items:center; gap:6px; }
  .balance-breakdown .dot { width:5px; height:5px; border-radius:50%; background:var(--green); flex-shrink:0;
                             box-shadow:0 0 6px rgba(63,185,104,.7); animation:livePulseDot 1.8s ease-in-out infinite; }
  @keyframes livePulseDot { 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

  /* ---- odometer digit-roll, same technique as the advertiser dashboard ---- */
  .digit-wrap { display:inline-block; height:1em; overflow:hidden; vertical-align:top; }
  .digit-strip { display:flex; flex-direction:column; transition:transform 1s cubic-bezier(.22,1,.36,1); }
  .digit-strip span { height:1em; line-height:1; display:flex; align-items:center; justify-content:center; }

  /* the hero card: real glass like everything else, but with more
     visual weight -- a soft warm ambient glow instead of the jagged
     electric-noise border that used to mark it as "the important one." */
  .balance-card.glass-panel { border-radius:22px; box-shadow:0 16px 36px -22px rgba(0,0,0,.55),
    inset 0 0 0 1px rgba(255,255,255,.14), inset 0 1px 0 rgba(255,255,255,.4), 0 0 70px -18px rgba(232,200,150,.32); }
  .progress-track { height:6px; background:var(--border); border-radius:100px; margin-top:18px; overflow:hidden; position:relative; }
  .progress-fill { height:100%; background:linear-gradient(90deg,#f2b134,#ec4899); border-radius:100px; transition:width .6s ease; position:relative; overflow:hidden; }
  .progress-fill::after { content:''; position:absolute; inset:0; width:40%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent);
    animation:progressShine 2.2s ease-in-out infinite; }
  @keyframes progressShine { 0%{ transform:translateX(-120%); } 100%{ transform:translateX(350%); } }
  .progress-note { font-size:12px; color:var(--muted); margin-top:8px; }

  /* one progress story, not two: this replaces the old checklist card
     that duplicated the progress bar above it -- same timeline pattern
     as the campaign dashboard, living inside the hero card instead of
     next to it. */
  .timeline { display:flex; align-items:flex-start; justify-content:space-between; margin-top:20px; }
  .tl-step { display:flex; flex-direction:column; align-items:center; text-align:center; flex:1; position:relative; }
  .tl-dot { width:12px; height:12px; border-radius:50%; background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.2);
            margin-bottom:8px; transition:background .3s, border-color .3s, box-shadow .3s; position:relative; z-index:1; }
  .tl-step.done .tl-dot { background:var(--gold); border-color:var(--gold); box-shadow:0 0 12px rgba(232,200,150,.6); }
  .tl-step::before { content:''; position:absolute; top:5px; left:-50%; width:100%; height:2px; background:rgba(255,255,255,.12); z-index:0; }
  .tl-step:first-child::before { display:none; }
  .tl-step.done::before { background:linear-gradient(90deg, var(--gold), rgba(232,200,150,.3)); }
  .tl-label { font-size:11.5px; color:var(--text); font-weight:600; }

  .badge-card { border-radius:12px; padding:20px 22px; margin-bottom:20px; }
  .badge-card-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  .badge-card-sub { font-size:13px; color:var(--muted); line-height:1.55; margin-bottom:14px; }
  .badge-preview { display:block; margin-bottom:14px; }
  .cmd-box { background:rgba(0,0,0,.55); border:1px solid var(--border); border-radius:11px; padding:12px 14px;
             display:flex; align-items:center; gap:10px; }
  .cmd-box code { flex:1; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:#a8f0c6;
                   overflow-x:auto; white-space:nowrap; }
  .cmd-box button { background:rgba(255,255,255,.08); border:1px solid var(--border); color:var(--text);
                     border-radius:7px; padding:8px 14px; font-size:12.5px; cursor:pointer; white-space:nowrap;
                     transition:background .2s; flex-shrink:0; }
  .cmd-box button:hover { background:rgba(255,255,255,.16); }

  .chart-card { border-radius:12px; padding:20px 22px; margin-bottom:20px; }
  #dailyEarningsChart { width:100%; height:150px; display:block; margin-top:10px; }
  .chart-empty { font-size:12.5px; color:var(--muted); margin-top:10px; }

  .share-card-panel { border-radius:12px; padding:20px 22px; margin-bottom:20px; }
  #shareCardCanvas { width:100%; height:auto; display:block; border-radius:12px; margin-bottom:14px;
    background:#07070a; border:1px solid var(--border); }
  .share-card-actions { display:flex; gap:10px; }
  .share-card-actions button { flex:1; }
  .share-card-note { font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.5; }

  .jackpot-card { background:linear-gradient(160deg, rgba(242,177,52,.08), var(--panel)); border:1px solid rgba(242,177,52,.25);
                  border-radius:12px; padding:20px 22px; margin-bottom:20px; }
  .jackpot-header { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  .jackpot-pool { font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:800; color:var(--gold);
                  text-shadow:0 0 20px rgba(232,200,150,.35); }
  .jackpot-status { font-size:13px; color:var(--muted); line-height:1.55; margin-bottom:14px; }
  .jackpot-status.eligible { color:var(--green); }
  .jackpot-history { border-top:1px solid var(--border); padding-top:12px; }
  .jackpot-history-label { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  .jackpot-draw { display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); padding:4px 0; }
  .jackpot-draw .amt { color:var(--gold); font-family:'JetBrains Mono',monospace; }
  .jackpot-empty { font-size:12.5px; color:var(--muted); }

  .form-panel { border-radius:12px; padding:22px; min-height:150px; }
  form { display:flex; flex-direction:column; gap:14px; transition:opacity .3s ease, transform .3s ease; }
  .cf-turnstile { max-width:100%; overflow:hidden; }
  form.hidden { opacity:0; transform:scale(.97); pointer-events:none; position:absolute; inset:22px; }
  label { font-size:12px; color:var(--muted); margin-bottom:6px; display:block; font-weight:500; }
  input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px;
          padding:11px 13px; color:var(--text); font-size:14px; font-family:inherit; transition:border-color .15s; }
  input:focus { outline:none; border-color:var(--gold); }
  button { background:linear-gradient(135deg,#e8c896,#d99a9a); color:#1a1408; border:none; border-radius:8px;
           padding:13px; font-weight:700; font-size:14px; cursor:pointer; transition:transform .15s, box-shadow .15s; }
  button:hover { transform:translateY(-1px); box-shadow:0 8px 24px -8px rgba(232,200,150,.4); }
  button:disabled { opacity:.5; cursor:default; }
  .status { font-size:13px; min-height:18px; }
  .status.err { color:#e5697a; }

  /* success state, replaces the form */
  .success-state { display:flex; flex-direction:column; align-items:center; text-align:center;
                    gap:14px; opacity:0; transform:scale(.95); transition:opacity .4s ease .1s, transform .4s cubic-bezier(.34,1.56,.64,1) .1s; }
  .success-state.show { opacity:1; transform:scale(1); }
  .success-check { width:52px; height:52px; border-radius:50%; background:var(--green);
                    display:flex; align-items:center; justify-content:center; }
  .success-title { font-size:15px; font-weight:600; }
  .success-detail { font-size:13px; color:var(--muted); line-height:1.5; }

  .trust-row { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-top:18px; }
  .trust-row svg { flex-shrink:0; color:var(--green); }

  .note { font-size:12px; color:var(--muted); margin-top:18px; line-height:1.6; padding:14px 16px; border-radius:8px; }
  .no-id { text-align:center; color:var(--muted); font-size:14px; padding:60px 20px; }

  /* ---- one-time name gate ---- */
  .name-gate { max-width:400px; }
  .name-gate h1 { font-size:24px; margin-bottom:8px; }
  .name-gate form { flex-direction:row; gap:10px; margin-top:22px; }
  .name-gate input { flex:1; }
  .name-gate button { flex-shrink:0; padding:11px 20px; }

  /* ---- de-emphasized technical footer, not a full card ---- */
  .tech-details { font-size:12px; color:#5a5a62; margin-top:28px; }
  .tech-details summary { cursor:pointer; color:var(--muted); list-style:none; display:inline-flex; align-items:center; gap:5px; }
  .tech-details summary::-webkit-details-marker { display:none; }
  .tech-details summary::before { content:'▸'; font-size:9px; transition:transform .2s; }
  .tech-details[open] summary::before { transform:rotate(90deg); }
  .tech-details .id-value { margin-top:10px; }

  .mega-wrap { width:100vw; margin-left:calc(50% - 50vw); margin-top:24px; overflow:hidden;
               display:flex; justify-content:center; padding:20px 0; }
  .mega-word { position:relative; font-family:'Fraunces',serif; font-weight:700;
               font-size:clamp(40px,13vw,150px); letter-spacing:-0.03em; line-height:1;
               white-space:nowrap; cursor:default; user-select:none; }
  .mega-base { color:transparent; -webkit-text-stroke:1.5px rgba(255,255,255,.14); }
  .mega-shine { position:absolute; inset:0;
    background:linear-gradient(100deg, transparent 30%, rgba(242,177,52,.4) 45%, rgba(63,185,104,.4) 50%, rgba(42,155,240,.4) 55%, transparent 70%);
    background-size:300% 100%; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation:megaShine 6s ease-in-out infinite; pointer-events:none; }
  @keyframes megaShine { 0%{ background-position:100% 0; } 100%{ background-position:-100% 0; } }
  .mega-glow { position:absolute; inset:0;
    background:radial-gradient(circle 220px at var(--mx,50%) var(--my,50%), #e8c896 0%, #3fb968 40%, #2a9bf0 70%, transparent 85%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    opacity:0; transition:opacity .4s ease; pointer-events:none; }
  .mega-word:hover .mega-glow, .mega-word.touched .mega-glow { opacity:1; }
  .mega-word:hover .mega-shine, .mega-word.touched .mega-shine { opacity:0; }
  .mega-word .ml { display:inline-block; font-variation-settings:'opsz' 144, 'wght' var(--w, 700);
    transition:font-variation-settings .22s cubic-bezier(.16,1,.3,1); }
  .no-id code { background:var(--panel); padding:3px 7px; border-radius:5px; border:1px solid var(--border); }
  #particles { position:fixed; inset:0; z-index:0; pointer-events:none; }
  .wrap { position:relative; z-index:2; }
  .magnetic { transition:transform .2s cubic-bezier(.16,1,.3,1); }
</style>
</head>
<body>
<div class="aurora"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<canvas id="particles"></canvas>
<div class="wrap">
  <a class="brand" href="install.html?stay=1"><img src="logo-192.png" alt=""><span>Meanwhile</span></a>
  <div id="app"></div>
  <div class="mega-wrap">
    <div class="mega-word" id="megaWord" aria-hidden="true">
      <span class="mega-base">Meanwhile</span>
      <span class="mega-shine">Meanwhile</span>
      <span class="mega-glow">Meanwhile</span>
    </div>
  </div>
  <div style="text-align:center; margin-top:24px; font-size:11px; color:#5a5a62;">
    <a href="terms.html" style="color:inherit">terms</a> · <a href="privacy.html" style="color:inherit">privacy</a>
  </div>
</div>
<div class="orb" id="orb"></div>

<script>
/* ---- Liquid Glass engine (MIT, github.com/rizroze/liquid-glass), same
   one running on the campaign dashboard and install page -- real SVG-
   displacement edge refraction + chromatic aberration, plus a motion-
   lagged specular highlight and content-adaptive tint sampled from this
   page's own aurora blobs (b1 purple, b2 teal, b3 gold). Applied to
   every .glass-panel; the hero balance card keeps its own distinct
   electric-border look on purpose, same call made on every other page. */
function glassResolveConfig(el, opts) {
  const rect = el.getBoundingClientRect();
  const ab = opts.aberration ?? [0, 10, 20];
  return {
    width: opts.width ?? Math.round(rect.width), height: opts.height ?? Math.round(rect.height),
    radius: opts.borderRadius ?? 50, scale: opts.scale ?? -180, border: opts.border ?? 0.07,
    lightness: opts.lightness ?? 50, alpha: opts.alpha ?? 0.93, blur: opts.blur ?? 11,
    r: ab[0], g: ab[1], b: ab[2], frost: opts.frost ?? 0, saturation: opts.saturation ?? 1,
    displace: opts.displaceBlur ?? 0,
  };
}
const glassIsChromium = typeof navigator !== 'undefined' && /Chrome\//.test(navigator.userAgent);
const _glassMapCache = new Map();
function glassBuildDisplacementMap(c) {
  const key = `${c.width}:${c.height}:${c.radius}:${c.scale}:${c.border}:${c.blur}:${c.lightness}:${c.alpha}`;
  const cached = _glassMapCache.get(key);
  if (cached) return cached;

const CLAIM_GLASS_BLOBS = [
  { sel: '.b1', color: [168, 85, 247] },
  { sel: '.b2', color: [20, 201, 165] },
  { sel: '.b3', color: [242, 177, 52] },
];
const claimGlassReducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

let claimGlassInstances = [];

function updateClaimGlassHighlight() {
  document.querySelectorAll('.glass-panel').forEach((card) => {
    if (claimGlassFlaring.has(card)) return;
    const r = card.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const targetMx = ((claimGlassPointer.x - r.left) / r.width) * 100;
    const targetMy = ((claimGlassPointer.y - r.top) / r.height) * 100;
    let cur = claimGlassCurrent.get(card);
    if (!cur) { cur = { mx: targetMx, my: targetMy }; claimGlassCurrent.set(card, cur); }
    else { cur.mx += (targetMx - cur.mx) * 0.18; cur.my += (targetMy - cur.my) * 0.18; }
    card.style.setProperty('--mx', `${cur.mx}%`);
    card.style.setProperty('--my', `${cur.my}%`);
  });
}

function updateClaimGlassTint() {
  const blobs = CLAIM_GLASS_BLOBS.map((b) => {
    const el = document.querySelector(b.sel);
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return { cx: r.left + r.width / 2, cy: r.top + r.height / 2, radius: r.width / 2, color: b.color };
  }).filter(Boolean);
  if (!blobs.length) return;

  document.querySelectorAll('.glass-panel').forEach((card) => {
    const r = card.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let wSum = 0, cr = 0, cg = 0, cb = 0;
    blobs.forEach((b) => {
      const d = Math.hypot(cx - b.cx, cy - b.cy);
      const influence = Math.max(0, 1 - d / (b.radius * 2.4)) * 0.32;
      wSum += influence;
      cr += b.color[0] * influence; cg += b.color[1] * influence; cb += b.color[2] * influence;
    });
    if (wSum > 0.01) {
      const strength = Math.min(0.24, wSum).toFixed(3);
      const lift = Math.min(0.06, wSum * 0.2);
      const r_ = Math.round(cr / wSum), g_ = Math.round(cg / wSum), b_ = Math.round(cb / wSum);
      card.style.background = `linear-gradient(180deg, rgba(255,255,255,${(0.1 + lift).toFixed(3)}), rgba(255,255,255,${(0.03 + lift).toFixed(3)})), radial-gradient(120% 100% at 50% 0%, rgba(${r_},${g_},${b_},${strength}), transparent 70%)`;
    } else {
      card.style.background = '';
    }
  });
}

/* runs only while the highlight is actually still catching up, not
   forever -- settles for ~500ms after the last real pointer move

   until the next one, instead of a 60x/sec rAF chain for the whole tab

let claimGlassMoveUntil = 0;

  else claimGlassLoopActive = false;
}

  claimGlassLoopActive = true;

if (!claimGlassReducedMotion) {

/* Real rubber-band physics, same family as iOS's pull-to-refresh bounce:
   grab a glass card and it resists with diminishing tension the further
   you pull (sqrt curve, not linear) plus a slight contraction, like the
   material has real give. Let go and it springs back with genuine
   overshoot -- a live position/velocity simulation, not a fixed-duration
   CSS ease, so it actually oscillates and settles the way something
   physical would. Purely tactile, nothing actually moves anywhere, so a
   4px movement threshold before engaging keeps ordinary clicks on
   buttons/links inside a card working exactly as before. */
function armElasticGlass() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('.glass-panel').forEach((el) => {
    let dragging = false, moved = false;
    let startX = 0, startY = 0, curX = 0, curY = 0;
    let animId = null;

    function rubberBand(delta) {
      const sign = delta < 0 ? -1 : 1;
      return sign * Math.sqrt(Math.abs(delta)) * 3.2;
    }
    function applyTransform(x, y) {
      const dist = Math.hypot(x, y);
      const scale = 1 - Math.min(dist / 900, 0.035);
      el.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    }
    function onDown(e) {
      if (e.button !== undefined && e.button !== 0) return;
      dragging = true; moved = false;
      startX = e.clientX; startY = e.clientY;
      cancelAnimationFrame(animId);
    }
    function onMove(e) {
      if (!dragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (!moved && Math.hypot(dx, dy) > 4) moved = true;
      if (!moved) return;
      curX = rubberBand(dx); curY = rubberBand(dy);
      applyTransform(curX, curY);
    }
    function onUp() {
      if (!dragging) return;
      dragging = false;
      if (moved) springBack();
    }
    function springBack() {
      let x = curX, y = curY, vx = 0, vy = 0;
      const stiffness = 0.16, damping = 0.74;
      function step() {
        vx = (vx - x * stiffness) * damping;
        vy = (vy - y * stiffness) * damping;
        x += vx; y += vy;
        applyTransform(x, y);
        if (Math.abs(x) > 0.4 || Math.abs(y) > 0.4 || Math.abs(vx) > 0.4 || Math.abs(vy) > 0.4) {
          animId = requestAnimationFrame(step);
        } else {
          el.style.transform = '';
        }
      }
      animId = requestAnimationFrame(step);
    }
    el.addEventListener('pointerdown', onDown);
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointerleave', onUp);
    el.addEventListener('pointercancel', onUp);
  });
}

/* the "something new" for this page specifically: the glass panels
   catch light at the exact instant a REAL new line was shown and money
   was actually earned (same total_calls delta loadBalance() already
   uses to spawn particle pulses) -- not a decorative timer. Fitting for
   the one page whose entire job is showing you real money arriving. */
function flashGlassPanels() {
  if (claimGlassReducedMotion) {
    document.querySelectorAll('.glass-panel').forEach((el) => {
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 900);
    });

  }
  document.querySelectorAll('.glass-panel').forEach((card) => {
    card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
    setTimeout(() => card.classList.remove('flash'), 900);

    claimGlassFlaring.add(card);

    const duration = 700;
    function step(now) {
      const t = Math.min(1, (now - start) / duration);
      const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
      card.style.setProperty('--mx', `${-20 + ease * 140}%`);
      card.style.setProperty('--my', `4%`);

}

/** Never render the full registered email anywhere -- a leaked install
 * ID would otherwise hand an attacker exactly the value they'd need to
 * "prove" they know the current email when trying to redirect payouts. */
function maskEmail(email) {
  const [user, domain] = email.split('@');
  if (!domain) return '••••••';
  const maskedUser = user.length <= 2 ? user[0] + '•' : user[0] + '•'.repeat(Math.min(user.length - 2, 5)) + user[user.length - 1];
  const [domName, ...domRest] = domain.split('.');
  const maskedDom = domName.length <= 2 ? domName[0] + '•' : domName[0] + '•'.repeat(Math.min(domName.length - 2, 5)) + domName[domName.length - 1];
  return `${maskedUser}@${maskedDom}.${domRest.join('.')}`;
}

  function flyOrbToBadge(fromEl) {
    const orb = document.getElementById('orb');
    const badge = document.getElementById('ppBadge');
    const from = fromEl.getBoundingClientRect();
    const to = badge.getBoundingClientRect();
    const startX = from.left + from.width / 2, startY = from.top + from.height / 2;
    const endX = to.left + to.width / 2, endY = to.top + to.height / 2;

    orb.style.left = startX + 'px';
    orb.style.top = startY + 'px';
    orb.style.opacity = '1';

    const midX = (startX + endX) / 2, midY = Math.min(startY, endY) - 70;
    const anim = orb.animate([
      { transform: 'translate(-50%,-50%) scale(1)', offset: 0 },
      { transform: `translate(${midX - startX - 5}px, ${midY - startY}px) scale(1.3)`, offset: .5 },
      { transform: `translate(${endX - startX}px, ${endY - startY}px) scale(.4)`, offset: 1 },
    ], { duration: 700, easing: 'cubic-bezier(.3,.1,.3,1)' });

    anim.onfinish = () => {
      orb.style.opacity = '0';
      badge.classList.add('pulse');
      document.getElementById('ppRing').classList.add('expand');
      setTimeout(() => {
        badge.classList.remove('pulse');
        document.getElementById('ppRing').classList.remove('expand');
      }, 800);
    };
  }

  /* same odometer digit-roll technique as the advertiser dashboard --
     non-digit characters ($ and .) just render flat, only the digits
     roll, so this works fine on a dollar amount as-is. */
  /* same technique as the campaign dashboard's daily-impressions chart --
     a running total alone can't show "is this picking up or slowing
     down," so this is the day-by-day version of that same idea, just in
     dollars instead of raw impression counts. */
  function drawDailyEarningsChart(canvasEl, daily) {
    const days = Object.keys(daily).sort().slice(-14);
    if (days.length === 0) return false;
    const dpr = window.devicePixelRatio || 1;
    const w = canvasEl.clientWidth, h = 150;
    const baseline = h - 26;
    canvasEl.width = w * dpr; canvasEl.height = h * dpr;
    const c = canvasEl.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, canvasEl.width, canvasEl.height);
    c.scale(dpr, dpr);
    const max = Math.max(...days.map(d => daily[d]), 0.01);
    const barW = w / days.length;
    days.forEach((d, i) => {
      const val = daily[d];
      const barH = Math.max(2, (val / max) * (baseline - 24));
      const x = i * barW + barW * 0.2;
      const bw = barW * 0.6;
      const cx = x + bw / 2;
      const grad = c.createLinearGradient(0, baseline - barH, 0, baseline);
      grad.addColorStop(0, '#e8c896');
      grad.addColorStop(1, 'rgba(232,200,150,.3)');
      c.fillStyle = grad;
      c.beginPath();
      c.roundRect(x, baseline - barH, bw, barH, 3);
      c.fill();
      if (val > 0 && barW > 22) {
        c.fillStyle = 'rgba(245,240,230,.75)';
        c.font = '10px "JetBrains Mono", monospace';
        c.textAlign = 'center';
        c.fillText('$' + val.toFixed(val < 1 ? 3 : 2), cx, baseline - barH - 6);
      }
      const date = new Date(d + 'T00:00:00Z');
      const label = barW > 46
        ? date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' })
        : String(date.getUTCDate());
      c.fillStyle = 'rgba(140,140,150,.8)';
      c.font = '10px Inter, sans-serif';
      c.textAlign = 'center';
      c.fillText(label, cx, h - 8);
    });
    return true;
  }

  /** The whole point of this card is that it gets screenshotted and
   * shared -- it has to hold up at full resolution, not just look fine
   * shrunk down in the dashboard. Drawn at a fixed 1200x630 logical size
   * (standard social-card ratio) and scaled by devicePixelRatio so a
   * download from a Retina screen isn't blurry. Waits on document.fonts
   * before drawing so Fraunces/JetBrains Mono are actually loaded --
   * drawing one frame too early silently falls back to a generic serif/
   * mono and every export from a fresh page load would look wrong. */
  async function drawShareCard(canvasEl, data) {
    if (document.fonts && document.fonts.ready) {
      try { await document.fonts.ready; } catch (e) {}
    }
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = 1200, H = 630;
    canvasEl.width = W * dpr;
    canvasEl.height = H * dpr;
    const c = canvasEl.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, canvasEl.width, canvasEl.height);
    c.scale(dpr, dpr);

    c.fillStyle = '#07070a';
    c.fillRect(0, 0, W, H);

    const glow1 = c.createRadialGradient(980, 70, 0, 980, 70, 440);
    glow1.addColorStop(0, 'rgba(242,177,52,.22)');
    glow1.addColorStop(1, 'rgba(242,177,52,0)');
    c.fillStyle = glow1;
    c.fillRect(0, 0, W, H);

    const glow2 = c.createRadialGradient(120, 580, 0, 120, 580, 400);
    glow2.addColorStop(0, 'rgba(168,85,247,.16)');
    glow2.addColorStop(1, 'rgba(168,85,247,0)');
    c.fillStyle = glow2;
    c.fillRect(0, 0, W, H);

    // faint ghost wordmark, echoing the same big-type treatment used
    // elsewhere on the site -- fills the right-side negative space
    // without competing with the real numbers
    c.save();
    c.fillStyle = 'rgba(255,255,255,.035)';
    c.font = '700 210px Fraunces, serif';
    c.textAlign = 'right';
    c.textBaseline = 'middle';
    c.fillText('Meanwhile', W - 40, H / 2 + 10);
    c.restore();

    c.strokeStyle = 'rgba(255,255,255,.08)';
    c.lineWidth = 1;
    c.beginPath();
    c.roundRect(0.5, 0.5, W - 1, H - 1, 28);
    c.stroke();

    // wordmark
    const dotColors = ['#f2b134', '#ec4899', '#a855f7'];
    dotColors.forEach((color, i) => {
      c.fillStyle = color;
      c.beginPath();
      c.arc(64 + i * 14, 62, 4, 0, Math.PI * 2);
      c.fill();
    });
    c.fillStyle = '#f5f0e6';
    c.font = '700 26px Fraunces, serif';
    c.textAlign = 'left';
    c.textBaseline = 'middle';
    c.fillText('Meanwhile', 118, 63);

    c.fillStyle = 'rgba(140,140,150,.85)';
    c.font = '13px "JetBrains Mono", monospace';
    c.textAlign = 'right';
    c.fillText('trymeanwhile.online', W - 64, 63);

    // small tracked label
    c.textAlign = 'left';
    c.fillStyle = '#e8c896';
    c.font = '600 15px Inter, sans-serif';
    try { c.letterSpacing = '2px'; } catch (e) {}
    c.fillText('MADE WHILE MY AGENT THOUGHT', 64, 195);
    try { c.letterSpacing = '0px'; } catch (e) {}

    // big amount -- shrinks to fit rather than ever overflowing the card
    const amountText = '$' + data.amount.toFixed(2);
    const maxAmountWidth = W - 128;
    let amountSize = 150;
    c.textBaseline = 'alphabetic';
    do {
      c.font = `800 ${amountSize}px "JetBrains Mono", monospace`;
      amountSize -= 4;
    } while (c.measureText(amountText).width > maxAmountWidth && amountSize > 60);
    const amountGrad = c.createLinearGradient(64, 0, 64 + c.measureText(amountText).width, 0);
    amountGrad.addColorStop(0, '#f2b134');
    amountGrad.addColorStop(0.4, '#f0654a');
    amountGrad.addColorStop(0.7, '#ec4899');
    amountGrad.addColorStop(1, '#a855f7');
    c.fillStyle = amountGrad;
    c.fillText(amountText, 64, 340);

    // subtitle
    c.fillStyle = 'rgba(245,240,230,.92)';
    c.font = 'italic 400 32px Fraunces, serif';
    c.fillText('earned while my AI agent thought.', 64, 390);

    // promo pill, only if the window's still actually active
    let statsY = 462;
    if (data.promoActive && data.promoNumber) {
      const label = `EARLY DEVELOPER #${data.promoNumber} — 100% FOR ${data.promoDaysLeft} MORE DAY${data.promoDaysLeft === 1 ? '' : 'S'}`;
      c.font = '700 15px "JetBrains Mono", monospace';
      const pillW = c.measureText(label).width + 32;
      const pillH = 34;
      c.fillStyle = 'rgba(242,177,52,.12)';
      c.strokeStyle = 'rgba(242,177,52,.4)';
      c.lineWidth = 1;
      c.beginPath();
      c.roundRect(64, statsY - pillH - 2, pillW, pillH, 17);
      c.fill();
      c.stroke();
      c.fillStyle = '#f2b134';
      c.textBaseline = 'middle';
      c.fillText(label, 80, statsY - pillH / 2 - 2);
      c.textBaseline = 'alphabetic';
      statsY += 48;
    }

    // stats line
    c.fillStyle = 'rgba(180,180,190,.95)';
    c.font = '22px Inter, sans-serif';
    const statsText = data.totalCalls > 0
      ? `${data.totalCalls} line${data.totalCalls === 1 ? '' : 's'} shown · ${data.sponsorCalls} sponsored (${data.ratio}%)`
      : 'just getting started — more to come';
    c.fillText(statsText, 64, statsY);

    // divider + install line
    c.strokeStyle = 'rgba(255,255,255,.08)';
    c.beginPath();
    c.moveTo(64, 520);
    c.lineTo(W - 64, 520);
    c.stroke();

    c.textBaseline = 'middle';
    c.fillStyle = 'rgba(63,185,104,.95)';
    c.font = '600 17px "JetBrains Mono", monospace';
    c.textAlign = 'left';
    c.fillText('$ npx trymeanwhile', 64, 566);

    c.fillStyle = 'rgba(140,140,150,.85)';
    c.font = '15px Inter, sans-serif';
    c.textAlign = 'right';
    c.fillText('half the money, none of the cold ads →', W - 64, 566);
  }

  function renderOdometer(el, text) {
    const chars = text.split('');
    el.innerHTML = chars.map(ch => {
      if (isNaN(parseInt(ch, 10))) return `<span>${ch}</span>`;
      const strip = Array.from({ length: 10 }, (_, n) => `<span>${n}</span>`).join('');
      return `<span class="digit-wrap"><span class="digit-strip" data-target="${ch}">${strip}</span></span>`;
    }).join('');
    requestAnimationFrame(() => {
      el.querySelectorAll('.digit-strip').forEach(strip => {
        strip.style.transform = `translateY(-${strip.dataset.target}em)`;
      });
    });
  }

  /* ---------- jackpot ----------
     Mirrors worker.js's JACKPOT_MIN_CALLS -- if that constant ever
     changes, this needs to change with it. No endpoint exposes it, so
     this is the one place that has to be kept in sync by hand. */
  const JACKPOT_MIN_CALLS = 10;
  let currentTotalCalls = 0;
  let currentHasPayoutEmail = false;
  let currentJackpotWonTotal = 0;
  let jackpotPoolAmount = null;

  function renderJackpotStatus() {
    const statusEl = document.getElementById('jackpotStatus');
    if (jackpotPoolAmount === null) return; // pool hasn't loaded yet
    const wonNote = currentJackpotWonTotal > 0
      ? ` You've won $${currentJackpotWonTotal.toFixed(2)} from it so far.`
      : '';
    if (currentHasPayoutEmail && currentTotalCalls >= JACKPOT_MIN_CALLS) {
      statusEl.className = 'jackpot-status eligible';
      statusEl.textContent = `You're in the running — every install with a registered payout and real usage gets an equal shot, drawn once a month.${wonNote}`;
    } else if (!currentHasPayoutEmail) {
      statusEl.className = 'jackpot-status';
      statusEl.textContent = `Register your payout email above to enter.${wonNote}`;
    } else {
      const remaining = JACKPOT_MIN_CALLS - currentTotalCalls;
      statusEl.className = 'jackpot-status';
      statusEl.textContent = `${remaining} more line${remaining === 1 ? '' : 's'} of real usage to qualify for this month's draw.${wonNote}`;
    }
  }

  let hasLoadedJackpotOnce = false;
  async function loadJackpotHistory() {
    if (document.hidden && hasLoadedJackpotOnce) return;
    hasLoadedJackpotOnce = true;
    try {
      const res = await fetch(`https://trymeanwhile.online/jackpot-history`);
      const s = await res.json();
      jackpotPoolAmount = s.current_pool_usd || 0;
      document.getElementById('jackpotPool').textContent = '$' + jackpotPoolAmount.toFixed(2);
      renderJackpotStatus();

      const historyEl = document.getElementById('jackpotHistory');
      const draws = (s.draws || []).slice(0, 5);
      if (draws.length === 0) {
        historyEl.innerHTML = '<div class="jackpot-empty">No draws yet — the first one happens once the pool clears $50.</div>';
        return;
      }
      const rows = draws.map(d => {
        const monthLabel = new Date(d.month + '-02').toLocaleDateString(undefined, { month: 'short', year: 'numeric' });
        return `<div class="jackpot-draw"><span>${monthLabel} — ${d.candidate_count} entrant${d.candidate_count === 1 ? '' : 's'}</span><span class="amt">$${d.amount_usd.toFixed(2)}</span></div>`;
      }).join('');
      historyEl.innerHTML = `<div class="jackpot-history-label">Recent draws</div>${rows}`;
    } catch (e) {
      document.getElementById('jackpotPool').textContent = '$–';
    }
  }
  // Hidden until the pool actually has real money in it -- an empty
  // "$0.00, no draws yet" card is honest but underwhelming for the
  // first handful of devs. Flip JACKPOT_UI_ENABLED once there's
  // something worth showing (jackpotCard's style="display:none" needs
  // removing too).
  const JACKPOT_UI_ENABLED = false;
  if (JACKPOT_UI_ENABLED) {
    loadJackpotHistory();
    setInterval(loadJackpotHistory, 60000);
  }

  let lastTotalCalls = null;
  let lastAmountText = null;
  let lastShareCardKey = null;
  let lastPromoBadgeState = null;
  let hasLoadedBalanceOnce = false;
  async function loadBalance() {
    // Never skip the very first call -- a tab opened in the background
    // (a middle-clicked link, e.g.) still needs its initial render, or
    // the whole dashboard is stuck on placeholder text forever until it
    // happens to become visible. Only repeat polls are the actual waste.
    if (document.hidden && hasLoadedBalanceOnce) return;
    hasLoadedBalanceOnce = true;
    try {
      const res = await fetch(`https://trymeanwhile.online/earnings?id=${id}`);
      const s = await res.json();
      const amt = s.user_earnings || 0;
      const amountText = '$' + amt.toFixed(2);
      if (amountText !== lastAmountText) {
        renderOdometer(document.getElementById('amount'), amountText);
        lastAmountText = amountText;
      }
      // Unlike the old permanent founder badge, this one genuinely
      // changes over time -- days-left counts down, and the badge should
      // disappear once the window actually closes -- so it re-renders
      // whenever that state changes, not just once ever.
      const promoBadgeState = `${s.promo_active}|${s.promo_days_left}|${s.promo_number || ''}`;
      if (promoBadgeState !== lastPromoBadgeState) {
        lastPromoBadgeState = promoBadgeState;
        const badge = document.getElementById('promoBadge');
        if (s.promo_active && s.promo_number) {
          badge.innerHTML = `<span class="fb-dot"></span> Early developer #${s.promo_number} — 100% for ${s.promo_days_left} more day${s.promo_days_left === 1 ? '' : 's'}`;
          badge.style.display = 'inline-flex';
        } else {
          badge.style.display = 'none';
        }
      }
      const totalCalls = s.total_calls || 0;
      const sponsorCalls = s.sponsor_calls || 0;
      const ratio = totalCalls > 0 ? Math.round((sponsorCalls / totalCalls) * 100) : 0;
      document.getElementById('balanceBreakdown').innerHTML = totalCalls > 0
        ? `<span class="dot"></span> ${totalCalls} line${totalCalls === 1 ? '' : 's'} shown · ${sponsorCalls} sponsored (${ratio}%)`
        : `<span class="dot"></span> no lines shown yet — open Claude Code to start`;

      // Only worth a redraw when a number on the card actually changed --
      // this canvas draw is heavier than the odometer/breakdown updates
      // above, no reason to repeat it every 8s poll if nothing moved.
      const shareCardKey = `${amountText}|${totalCalls}|${sponsorCalls}|${s.promo_active}|${s.promo_days_left}|${s.promo_number || ''}`;
      if (shareCardKey !== lastShareCardKey) {
        lastShareCardKey = shareCardKey;
        drawShareCard(document.getElementById('shareCardCanvas'), {
          amount: amt, totalCalls, sponsorCalls, ratio,
          promoNumber: s.promo_number || null, promoActive: s.promo_active, promoDaysLeft: s.promo_days_left,
        });
      }
      const earningsChartCanvas = document.getElementById('dailyEarningsChart');
      const hasChartData = drawDailyEarningsChart(earningsChartCanvas, s.daily_earnings || {});
      earningsChartCanvas.style.display = hasChartData ? 'block' : 'none';
      const chartEmptyEl = document.getElementById('chartEmpty');
      chartEmptyEl.style.display = hasChartData ? 'none' : 'block';
      if (!hasChartData) {
        // Two different empty states, not one -- "nothing's happened at
        // all" and "real activity, just no paid lines yet" look
        // identical if you only check for chart data, but they read very
        // differently to someone watching lines actually show up in
        // their terminal with a $0 chart underneath.
        chartEmptyEl.textContent = totalCalls > 0
          ? `${totalCalls} line${totalCalls === 1 ? '' : 's'} shown so far, none sponsored yet — normal early on, more sponsors means more paid lines.`
          : 'No earnings yet — open Claude Code to start.';
      }
      const pct = Math.min(100, (amt / THRESHOLD) * 100);
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressNote').textContent =
        amt >= THRESHOLD ? 'Threshold reached — included in next payout' : `$${(THRESHOLD - amt).toFixed(2)} to go until payout`;
      if (amt >= THRESHOLD) {
        document.getElementById('tlThreshold').classList.add('done');
      }
      // Safety net only -- the initial render already reflects payout_email
      // correctly (passed straight into renderDashboard, no flash). This
      // just catches drift if the value changed since that first render,
      // without clobbering the form mid-edit.
      if (s.payout_email && !originalPayoutEmail) {
        originalPayoutEmail = s.payout_email;
        document.getElementById('tlPayout').classList.add('done');
        document.getElementById('destNote').textContent = maskEmail(s.payout_email);
      }
      if (typeof spawnYourPulse === 'function' && lastTotalCalls !== null && s.total_calls > lastTotalCalls) {
        const delta = Math.min(4, s.total_calls - lastTotalCalls);
        for (let i = 0; i < delta; i++) setTimeout(spawnYourPulse, i * 250);
        flashGlassPanels();
      }
      lastTotalCalls = s.total_calls;
      currentTotalCalls = totalCalls;
      currentHasPayoutEmail = !!(s.payout_email || originalPayoutEmail);
      currentJackpotWonTotal = s.jackpot_won_total || 0;
      renderJackpotStatus();
      try { localStorage.setItem('meanwhile_id', id); } catch (e) {}
    } catch (e) {
      document.getElementById('progressNote').textContent = 'Could not reach server';
    }
  }
  loadBalance();
  setInterval(loadBalance, 8000);
  mountTurnstile('claimFormTurnstile');

  document.getElementById('claimForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const status = document.getElementById('status');
    const email = document.getElementById('email').value.trim();
    const emailConfirm = document.getElementById('emailConfirm').value.trim();
    const currentEmail = document.getElementById('currentEmail').value.trim();
    const mismatchNote = document.getElementById('emailMismatch');

    if (originalPayoutEmail && !email) {
      status.textContent = 'Already registered — enter a new email above only if you want to change it.';
      status.className = 'status err';
      return;
    }

    if (email.toLowerCase() !== emailConfirm.toLowerCase()) {
      mismatchNote.style.display = 'block';
      document.getElementById('emailConfirm').focus();
      return;
    }
    mismatchNote.style.display = 'none';

    if (originalPayoutEmail && originalPayoutEmail.toLowerCase() !== email.toLowerCase() && !currentEmail) {
      status.textContent = 'Enter the currently registered email above to confirm it\'s really you.';
      status.className = 'status err';
      document.getElementById('currentEmail').focus();
      return;
    }

    const turnstileToken = getTurnstileToken('claimFormTurnstile');
    if (window.turnstile && !turnstileToken) {
      status.textContent = 'Complete the verification check above first.';
      status.className = 'status err';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Registering…';
    try {
      const body = { id, email, turnstile_token: turnstileToken };
      if (originalPayoutEmail && originalPayoutEmail.toLowerCase() !== email.toLowerCase()) {
        body.current_email = currentEmail;
      }
      const res = await fetch('https://trymeanwhile.online/register-payout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'failed');

      flyOrbToBadge(btn);
      document.getElementById('destNote').textContent = email;
      document.getElementById('tlPayout').classList.add('done');
      document.getElementById('successDetail').textContent = `Payouts go to ${email} once you cross $${THRESHOLD}.`;

      setTimeout(() => {
        document.getElementById('claimForm').classList.add('hidden');
        document.getElementById('successState').classList.add('show');
      }, 500);
    } catch (err) {
      status.textContent = 'Something went wrong — check the email and try again.';
      status.className = 'status err';
      btn.disabled = false;
      btn.textContent = 'Register for payout';
      resetTurnstile('claimFormTurnstile');
    }
  });
}

/* ---------- your node ----------
 * A quiet ring of the wider network, with one node marked as you --
 * bigger, gold, centered. Every time your real usage ticks up (checked
 * against /earnings on each poll), your node actually flares and sends
 * a pulse out into the network. This is your position in the system,
 * not a generic animation. */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const RING_COUNT = 24;
const you = { r: 3 };
const ring = Array.from({ length: RING_COUNT }, (_, i) => {
  const a = (i / RING_COUNT) * Math.PI * 2 + Math.random() * 0.25;
  const rad = Math.min(W, H) * (0.3 + Math.random() * 0.55);
  return { a, rad, r: 1 + Math.random() * 1.2, drift: (Math.random() - 0.5) * 0.0005 };
});
const pulses = [];

function spawnYourPulse() {
  const n = ring[Math.floor(Math.random() * ring.length)];
  pulses.push({ node: n, t0: performance.now(), dur: 950 });
}

function tick(t) {
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.32;

  const pts = ring.map(n => {
    n.a += n.drift;
    return { x: cx + Math.cos(n.a) * n.rad, y: cy + Math.sin(n.a) * n.rad, r: n.r };
  });

  for (const p of pts) {
    ctx.strokeStyle = 'rgba(232,200,150,0.04)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }

  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    const idx = ring.indexOf(p.node);
    const target = pts[idx] || pts[0];
    const progress = (t - p.t0) / p.dur;
    if (progress >= 1) { pulses.splice(i, 1); continue; }
    const ease = 1 - Math.pow(1 - Math.min(1, progress * 1.5), 3);
    const glow = Math.sin(Math.min(1, progress) * Math.PI);
    const x = cx + (target.x - cx) * ease, y = cy + (target.y - cy) * ease;
    ctx.strokeStyle = `rgba(242,177,52,${0.5 * glow})`;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, y, 1.5 + glow * 2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(242,177,52,${0.55 * glow})`;
    ctx.shadowBlur = 14 * glow;
    ctx.shadowColor = 'rgba(242,177,52,0.8)';
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  for (const p of pts) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(232,200,150,0.18)';
    ctx.fill();
  }

  const pulse = 1 + Math.sin(t / 600) * 0.15;
  ctx.beginPath();
  ctx.arc(cx, cy, you.r * pulse, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(242,177,52,0.7)';
  ctx.shadowBlur = 12;
  ctx.shadowColor = 'rgba(242,177,52,0.7)';
  ctx.fill();
  ctx.shadowBlur = 0;

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
setInterval(() => { if (Math.random() < 0.3) spawnYourPulse(); }, 5000);

/* ---------- giant interactive wordmark ---------- */
const megaWord = document.getElementById('megaWord');
if (megaWord) {
  const setMegaPos = (x, y) => {
    const r = megaWord.getBoundingClientRect();
    megaWord.style.setProperty('--mx', ((x - r.left) / r.width * 100) + '%');
    megaWord.style.setProperty('--my', ((y - r.top) / r.height * 100) + '%');
  };
  megaWord.addEventListener('mousemove', (e) => setMegaPos(e.clientX, e.clientY));
  megaWord.addEventListener('touchstart', (e) => {
    const t = e.touches[0]; if (!t) return;
    setMegaPos(t.clientX, t.clientY); megaWord.classList.add('touched');
  }, { passive: true });
  megaWord.addEventListener('touchmove', (e) => {
    const t = e.touches[0]; if (!t) return;
    setMegaPos(t.clientX, t.clientY); megaWord.classList.add('touched');
  }, { passive: true });
  megaWord.addEventListener('touchend', () => {
    setTimeout(() => megaWord.classList.remove('touched'), 900);
  });

  /* text-pressure: split into letters across all three layers, weight
     responds to cursor proximity using Fraunces' real variable wght axis */
  const megaLayers = megaWord.querySelectorAll('.mega-base, .mega-shine, .mega-glow');
  const megaLetters = [];
  megaLayers.forEach((layer, layerIdx) => {
    const letters = layer.textContent.split('');
    layer.innerHTML = letters.map((ch) => `<span class="ml">${ch === ' ' ? '&nbsp;' : ch}</span>`).join('');
    layer.querySelectorAll('.ml').forEach((span, i) => {
      if (layerIdx === 0) megaLetters.push([span]);
      else megaLetters[i].push(span);
    });
  });
  megaWord.addEventListener('mousemove', (e) => {
    megaLetters.forEach((spansAcrossLayers) => {
      const r = spansAcrossLayers[0].getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const dist = Math.abs(e.clientX - cx);
      const weight = Math.max(300, 900 - dist * 3.2);
      spansAcrossLayers.forEach((span) => span.style.setProperty('--w', weight.toFixed(0)));
    });
  });
  megaWord.addEventListener('mouseleave', () => {
    megaLetters.forEach((spansAcrossLayers) =>
      spansAcrossLayers.forEach((span) => span.style.removeProperty('--w'))
    );
  });
}
</script>

<script>
/* ---------- magnetic buttons -- nudge toward cursor within proximity ---------- */
document.querySelectorAll('.magnetic').forEach((el) => {
  el.addEventListener('mousemove', (e) => {
    const r = el.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2);
    const dy = e.clientY - (r.top + r.height / 2);
    el.style.transform = `translate(${dx * 0.25}px, ${dy * 0.25}px)`;
  });
  el.addEventListener('mouseleave', () => { el.style.transform = ''; });
});
</script>
