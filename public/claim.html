<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meanwhile — register your payout email</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,100..900&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --bg:#07070a; --panel:rgba(255,255,255,0.045); --panel-2:rgba(255,255,255,0.07); --border:rgba(255,255,255,0.1);
    --text:#f5f0e6; --muted:#8c8c96; --green:#3fb968; --gold:#e8c896;
    --pp-dark:#003087; --pp-light:#0070ba; --pp-glow:#2a9bf0;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,sans-serif;
         -webkit-font-smoothing:antialiased; min-height:100vh; overflow-x:hidden; }

  .aurora { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .blob { position:absolute; border-radius:50%; filter:blur(100px); opacity:.26; mix-blend-mode:screen; }
  .b1 { width:420px; height:420px; background:#a855f7; top:-150px; right:-130px; animation:float1 24s ease-in-out infinite; }
  .b2 { width:380px; height:380px; background:#14c9a5; top:40%; left:-140px; animation:float2 28s ease-in-out infinite; }
  .b3 { width:360px; height:360px; background:#f2b134; bottom:-140px; right:10%; animation:float3 30s ease-in-out infinite; }
  @keyframes float1 { 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-50px,70px) scale(1.1); } }
  @keyframes float2 { 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(60px,40px) scale(.92); } }
  @keyframes float3 { 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-40px,-50px) scale(1.08); } }

  .wrap { position:relative; z-index:1; max-width:460px; margin:0 auto; padding:56px 24px 80px; }

  .brand { display:flex; align-items:center; gap:10px; margin-bottom:36px; }
  .brand img { width:28px; height:28px; }
  .brand span { font-family:'Fraunces',serif; font-size:16px; font-weight:600; }

  .secure-badge { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--green);
                   background:rgba(63,185,104,.1); border:1px solid rgba(63,185,104,.25);
                   padding:5px 12px; border-radius:100px; margin-bottom:20px; }

  h1 { font-family:'Fraunces',serif; font-size:27px; font-weight:600; margin-bottom:8px; letter-spacing:-0.01em;
       background:linear-gradient(100deg,#f2b134,#f0654a,#ec4899,#a855f7,#3b82f6,#14c9a5,#f2b134);
       background-size:180% auto; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
       animation:shimmer 8s linear infinite; }
  @keyframes shimmer { to { background-position:180% center; } }
  .sub { color:var(--muted); font-size:14px; line-height:1.6; margin-bottom:28px; }

  /* ---- destination card: where the money actually goes ---- */
  .destination { display:flex; align-items:center; gap:16px; background:var(--panel);
                  border:1px solid var(--border); border-radius:14px; padding:18px 20px; margin-bottom:20px;
                  position:relative; overflow:hidden; }
  .pp-badge-wrap { position:relative; width:54px; height:54px; flex-shrink:0; }
  .pp-badge { width:54px; height:54px; border-radius:50%; background:#ffffff;
              display:flex; align-items:center; justify-content:center; position:relative; z-index:2;
              box-shadow:0 0 0 rgba(42,155,240,0); transition:box-shadow .5s ease, transform .4s cubic-bezier(.34,1.56,.64,1); }
  .pp-badge img { width:28px; height:auto; }
  .pp-badge.pulse { animation:ppPulse .7s ease; box-shadow:0 0 30px 6px rgba(42,155,240,.5); }
  @keyframes ppPulse { 0%{ transform:scale(1); } 35%{ transform:scale(1.18); } 100%{ transform:scale(1); } }
  .pp-ring { position:absolute; inset:-6px; border-radius:50%; border:2px solid var(--pp-glow); opacity:0;
             z-index:1; pointer-events:none; }
  .pp-ring.expand { animation:ppRing .8s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes ppRing { 0%{ opacity:.8; transform:scale(.6); } 100%{ opacity:0; transform:scale(2.2); } }
  .pp-ring-idle { position:absolute; inset:-6px; border-radius:50%; border:1.5px solid rgba(42,155,240,.4);
                  z-index:1; pointer-events:none; animation:ppIdle 2.8s ease-out infinite; }
  @keyframes ppIdle { 0%{ transform:scale(.85); opacity:.7; } 100%{ transform:scale(1.5); opacity:0; } }
  .dest-text .dest-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .dest-text .dest-value { font-size:15px; font-weight:600; margin-top:2px; }
  .dest-text .dest-note { font-size:12px; color:var(--muted); margin-top:2px; }

  /* the traveling orb, animated via JS along a path to the badge */
  .orb { position:fixed; width:10px; height:10px; border-radius:50%; background:var(--gold);
         box-shadow:0 0 12px 3px rgba(224,176,84,.7); pointer-events:none; z-index:80; opacity:0; }

  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px 22px; margin-bottom:20px; }
  .card-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  .id-value { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); word-break:break-all; }

  .balance-card { background:linear-gradient(180deg, var(--panel-2), var(--panel)); border:1px solid var(--border);
                   border-radius:12px; padding:24px 22px; margin-bottom:20px; }
  .balance-card .amount { font-family:'JetBrains Mono',monospace; font-size:36px; font-weight:700; color:var(--text); }
  .balance-card .lbl { font-size:12px; color:var(--muted); margin-top:2px; }

  /* ---- electric border (reactbits.dev), wraps the real earnings amount ---- */
  .electric-border { --electric-light-color: oklch(from var(--electric-border-color, #f2b134) l c h);
    position:relative; border-radius:inherit; overflow:visible; isolation:isolate; }
  .eb-canvas-container { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:2; }
  .eb-canvas { display:block; }
  .eb-content { position:relative; border-radius:inherit; z-index:1; }
  .eb-layers { position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:0; }
  .eb-glow-1, .eb-glow-2, .eb-background-glow { position:absolute; inset:0; border-radius:inherit; pointer-events:none; box-sizing:border-box; }
  .eb-glow-1 { border:2px solid oklch(from var(--electric-border-color, #f2b134) l c h / 0.6); filter:blur(1px); }
  .eb-glow-2 { border:2px solid var(--electric-light-color); filter:blur(4px); }
  .eb-background-glow { z-index:-1; transform:scale(1.1); filter:blur(32px); opacity:.3;
    background:linear-gradient(-30deg, var(--electric-light-color), transparent, var(--electric-border-color, #f2b134)); }
  .progress-track { height:6px; background:var(--border); border-radius:100px; margin-top:18px; overflow:hidden; position:relative; }
  .progress-fill { height:100%; background:linear-gradient(90deg,#f2b134,#ec4899); border-radius:100px; transition:width .6s ease; position:relative; overflow:hidden; }
  .progress-fill::after { content:''; position:absolute; inset:0; width:40%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent);
    animation:progressShine 2.2s ease-in-out infinite; }
  @keyframes progressShine { 0%{ transform:translateX(-120%); } 100%{ transform:translateX(350%); } }
  .progress-note { font-size:12px; color:var(--muted); margin-top:8px; }

  .steps { display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
  .step { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); }
  .step .check { flex-shrink:0; width:18px; height:18px; border-radius:50%; border:1.5px solid var(--border);
                  display:flex; align-items:center; justify-content:center;
                  transition:background .3s, border-color .3s, transform .35s cubic-bezier(.34,1.56,.64,1); }
  .step.done .check { background:var(--green); border-color:var(--green); transform:scale(1.15); }
  .step.done { color:var(--text); }

  .form-panel { position:relative; background:var(--panel); border:1px solid var(--border); border-radius:12px;
                padding:22px; min-height:150px; }
  form { display:flex; flex-direction:column; gap:14px; transition:opacity .3s ease, transform .3s ease; }
  form.hidden { opacity:0; transform:scale(.97); pointer-events:none; position:absolute; inset:22px; }
  label { font-size:12px; color:var(--muted); margin-bottom:6px; display:block; font-weight:500; }
  input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px;
          padding:11px 13px; color:var(--text); font-size:14px; font-family:inherit; transition:border-color .15s; }
  input:focus { outline:none; border-color:var(--gold); }
  button { background:linear-gradient(135deg,#e8c896,#d99a9a); color:#1a1408; border:none; border-radius:8px;
           padding:13px; font-weight:700; font-size:14px; cursor:pointer; transition:transform .15s, box-shadow .15s; }
  button:hover { transform:translateY(-1px); box-shadow:0 8px 24px -8px rgba(232,200,150,.4); }
  button:disabled { opacity:.5; cursor:default; }
  .status { font-size:13px; min-height:18px; }
  .status.err { color:#e5697a; }

  /* success state, replaces the form */
  .success-state { display:flex; flex-direction:column; align-items:center; text-align:center;
                    gap:14px; opacity:0; transform:scale(.95); transition:opacity .4s ease .1s, transform .4s cubic-bezier(.34,1.56,.64,1) .1s; }
  .success-state.show { opacity:1; transform:scale(1); }
  .success-check { width:52px; height:52px; border-radius:50%; background:var(--green);
                    display:flex; align-items:center; justify-content:center; }
  .success-title { font-size:15px; font-weight:600; }
  .success-detail { font-size:13px; color:var(--muted); line-height:1.5; }

  .trust-row { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-top:18px; }
  .trust-row svg { flex-shrink:0; color:var(--green); }

  .note { font-size:12px; color:var(--muted); margin-top:18px; line-height:1.6; padding:14px 16px;
          background:var(--panel); border-radius:8px; border:1px solid var(--border); }
  .no-id { text-align:center; color:var(--muted); font-size:14px; padding:60px 20px; }

  .mega-wrap { width:100vw; margin-left:calc(50% - 50vw); margin-top:24px; overflow:hidden;
               display:flex; justify-content:center; padding:20px 0; }
  .mega-word { position:relative; font-family:'Fraunces',serif; font-weight:700;
               font-size:clamp(40px,13vw,150px); letter-spacing:-0.03em; line-height:1;
               white-space:nowrap; cursor:default; user-select:none; }
  .mega-base { color:transparent; -webkit-text-stroke:1.5px rgba(255,255,255,.14); }
  .mega-shine { position:absolute; inset:0;
    background:linear-gradient(100deg, transparent 30%, rgba(242,177,52,.4) 45%, rgba(63,185,104,.4) 50%, rgba(42,155,240,.4) 55%, transparent 70%);
    background-size:300% 100%; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation:megaShine 6s ease-in-out infinite; pointer-events:none; }
  @keyframes megaShine { 0%{ background-position:100% 0; } 100%{ background-position:-100% 0; } }
  .mega-glow { position:absolute; inset:0;
    background:radial-gradient(circle 220px at var(--mx,50%) var(--my,50%), #e8c896 0%, #3fb968 40%, #2a9bf0 70%, transparent 85%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    opacity:0; transition:opacity .4s ease; pointer-events:none; }
  .mega-word:hover .mega-glow, .mega-word.touched .mega-glow { opacity:1; }
  .mega-word:hover .mega-shine, .mega-word.touched .mega-shine { opacity:0; }
  .mega-word .ml { display:inline-block; font-variation-settings:'opsz' 144, 'wght' var(--w, 700);
    transition:font-variation-settings .22s cubic-bezier(.16,1,.3,1); }
  .no-id code { background:var(--panel); padding:3px 7px; border-radius:5px; border:1px solid var(--border); }
  #particles { position:fixed; inset:0; z-index:0; pointer-events:none; }
  .wrap { position:relative; z-index:2; }
  .magnetic { transition:transform .2s cubic-bezier(.16,1,.3,1); }
</style>
</head>
<body>
<div class="aurora"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<canvas id="particles"></canvas>
<div class="wrap">
  <div class="brand"><img src="logo-192.png" alt=""><span>Meanwhile</span></div>
  <div id="app"></div>
  <div class="mega-wrap">
    <div class="mega-word" id="megaWord" aria-hidden="true">
      <span class="mega-base">Meanwhile</span>
      <span class="mega-shine">Meanwhile</span>
      <span class="mega-glow">Meanwhile</span>
    </div>
  </div>
  <div style="text-align:center; margin-top:24px; font-size:11px; color:#5a5a62;">
    <a href="terms.html" style="color:inherit">terms</a> · <a href="privacy.html" style="color:inherit">privacy</a>
  </div>
</div>
<div class="orb" id="orb"></div>

<script>
const params = new URLSearchParams(location.search);
const id = params.get('id');
const app = document.getElementById('app');
const THRESHOLD = 25;
const checkIcon = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#0d1117" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>`;
const ppMark = `<img src="paypal-mark.png" alt="PayPal">`;

/** Never render the full registered email anywhere -- a leaked install
 * ID would otherwise hand an attacker exactly the value they'd need to
 * "prove" they know the current email when trying to redirect payouts. */
function maskEmail(email) {
  const [user, domain] = email.split('@');
  if (!domain) return '••••••';
  const maskedUser = user.length <= 2 ? user[0] + '•' : user[0] + '•'.repeat(Math.min(user.length - 2, 5)) + user[user.length - 1];
  const [domName, ...domRest] = domain.split('.');
  const maskedDom = domName.length <= 2 ? domName[0] + '•' : domName[0] + '•'.repeat(Math.min(domName.length - 2, 5)) + domName[domName.length - 1];
  return `${maskedUser}@${maskedDom}.${domRest.join('.')}`;
}

if (!id) {
  app.innerHTML = `
    <h1>No install ID found</h1>
    <div class="no-id">Run <code>python3 ~/.deadtime-client/statusline.py --claim</code> in your terminal to get your personal link.</div>
  `;
} else {
  app.innerHTML = `
    <div class="secure-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Secured to your anonymous install ID
    </div>
    <h1>Register your payout email</h1>
    <p class="sub">Once your balance crosses $${THRESHOLD}, PayPal sends it to you automatically the next day — no manual step, no monthly wait.</p>

    <div class="destination">
      <div class="pp-badge-wrap">
        <div class="pp-ring-idle"></div>
        <div class="pp-ring" id="ppRing"></div>
        <div class="pp-badge" id="ppBadge">${ppMark}</div>
      </div>
      <div class="dest-text">
        <div class="dest-label">Payout destination</div>
        <div class="dest-value">PayPal</div>
        <div class="dest-note" id="destNote">Not connected yet</div>
      </div>
    </div>

    <div class="card electric-border" id="idCard">
      <div class="eb-canvas-container"><canvas class="eb-canvas"></canvas></div>
      <div class="eb-layers">
        <div class="eb-glow-1"></div>
        <div class="eb-glow-2"></div>
        <div class="eb-background-glow"></div>
      </div>
      <div class="eb-content">
        <div class="card-label">Your install ID</div>
        <div class="id-value">${id}</div>
      </div>
    </div>

    <div class="balance-card electric-border" id="balanceCard">
      <div class="eb-canvas-container"><canvas class="eb-canvas"></canvas></div>
      <div class="eb-layers">
        <div class="eb-glow-1"></div>
        <div class="eb-glow-2"></div>
        <div class="eb-background-glow"></div>
      </div>
      <div class="eb-content">
        <div class="amount" id="amount">–</div>
        <div class="lbl">current balance</div>
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        <div class="progress-note" id="progressNote">loading…</div>
      </div>
    </div>

    <div class="steps">
      <div class="step done"><span class="check">${checkIcon}</span> Install tracked and earning</div>
      <div class="step" id="stepEmail"><span class="check"></span> Register payout email</div>
      <div class="step" id="stepThreshold"><span class="check"></span> Cross $${THRESHOLD} balance</div>
      <div class="step"><span class="check"></span> Paid automatically, next daily run</div>
    </div>

    <div class="form-panel">
      <form id="claimForm">
        <div id="currentEmailWrap" style="display:none;">
          <label for="currentEmail">Current registered email (to confirm it's really you)</label>
          <input id="currentEmail" type="email" placeholder="what's on file now" autocomplete="off">
        </div>
        <div>
          <label for="email" id="emailLabel">PayPal email address</label>
          <input id="email" type="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div>
          <label for="emailConfirm">Type it again to confirm</label>
          <input id="emailConfirm" type="email" placeholder="you@example.com" required autocomplete="off">
        </div>
        <div id="emailMismatch" class="status err" style="display:none;">Those don't match — real money goes to whatever's registered here, worth getting right.</div>
        <button type="submit" id="submitBtn" class="magnetic">Register for payout</button>
        <div id="status" class="status"></div>
      </form>
      <div class="success-state" id="successState">
        <div class="success-check">${checkIcon.replace('11','20').replace('11','20')}</div>
        <div class="success-title">Connected to PayPal</div>
        <div class="success-detail" id="successDetail"></div>
      </div>
    </div>

    <div class="trust-row">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      We only store your email and this ID — nothing else, ever shared
    </div>

    <p class="note">Payouts run automatically, once a day, straight to your registered PayPal email the moment your balance crosses $${THRESHOLD} — no manual step, no waiting for a batch.</p>
  `;

  const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!prefersReducedMotion) import('./electricborder.js').then(({ initElectricBorder }) => {
    const balanceCard = document.getElementById('balanceCard');
    if (balanceCard) {
      try { initElectricBorder(balanceCard, { color: '#f2b134', speed: 1, chaos: 0.1, borderRadius: 12 }); } catch (e) { console.warn('[meanwhile] ElectricBorder failed:', e); }
    }
    const idCard = document.getElementById('idCard');
    if (idCard) {
      try { initElectricBorder(idCard, { color: '#a855f7', speed: 0.8, chaos: 0.08, borderRadius: 12 }); } catch (e) { console.warn('[meanwhile] ElectricBorder failed:', e); }
    }
  });

  function flyOrbToBadge(fromEl) {
    const orb = document.getElementById('orb');
    const badge = document.getElementById('ppBadge');
    const from = fromEl.getBoundingClientRect();
    const to = badge.getBoundingClientRect();
    const startX = from.left + from.width / 2, startY = from.top + from.height / 2;
    const endX = to.left + to.width / 2, endY = to.top + to.height / 2;

    orb.style.left = startX + 'px';
    orb.style.top = startY + 'px';
    orb.style.opacity = '1';

    const midX = (startX + endX) / 2, midY = Math.min(startY, endY) - 70;
    const anim = orb.animate([
      { transform: 'translate(-50%,-50%) scale(1)', offset: 0 },
      { transform: `translate(${midX - startX - 5}px, ${midY - startY}px) scale(1.3)`, offset: .5 },
      { transform: `translate(${endX - startX}px, ${endY - startY}px) scale(.4)`, offset: 1 },
    ], { duration: 700, easing: 'cubic-bezier(.3,.1,.3,1)' });

    anim.onfinish = () => {
      orb.style.opacity = '0';
      badge.classList.add('pulse');
      document.getElementById('ppRing').classList.add('expand');
      setTimeout(() => {
        badge.classList.remove('pulse');
        document.getElementById('ppRing').classList.remove('expand');
      }, 800);
    };
  }

  let emailFieldTouched = false;
  let originalPayoutEmail = null;
  document.getElementById('email').addEventListener('input', () => { emailFieldTouched = true; });
  document.getElementById('emailConfirm').addEventListener('input', () => { emailFieldTouched = true; });

  let lastTotalCalls = null;
  async function loadBalance() {
    try {
      const res = await fetch(`https://deadtime-server.bean-picker.workers.dev/earnings?id=${id}`);
      const s = await res.json();
      const amt = s.user_earnings || 0;
      document.getElementById('amount').textContent = '$' + amt.toFixed(2);
      const pct = Math.min(100, (amt / THRESHOLD) * 100);
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressNote').textContent =
        amt >= THRESHOLD ? 'Threshold reached — included in next payout' : `$${(THRESHOLD - amt).toFixed(2)} to go until payout`;
      if (amt >= THRESHOLD) {
        document.getElementById('stepThreshold').classList.add('done');
        document.getElementById('stepThreshold').querySelector('.check').innerHTML = checkIcon;
      }
      if (s.payout_email) {
        originalPayoutEmail = s.payout_email;
        document.getElementById('stepEmail').classList.add('done');
        document.getElementById('stepEmail').querySelector('.check').innerHTML = checkIcon;
        document.getElementById('destNote').textContent = maskEmail(s.payout_email);
        document.getElementById('emailLabel').textContent = 'New PayPal email address';
        document.getElementById('email').placeholder = 'only fill in to change it';
        document.getElementById('email').required = false;
        document.getElementById('emailConfirm').required = false;
        document.getElementById('currentEmailWrap').style.display = 'block';
      }
      if (typeof spawnYourPulse === 'function' && lastTotalCalls !== null && s.total_calls > lastTotalCalls) {
        const delta = Math.min(4, s.total_calls - lastTotalCalls);
        for (let i = 0; i < delta; i++) setTimeout(spawnYourPulse, i * 250);
      }
      lastTotalCalls = s.total_calls;
    } catch (e) {
      document.getElementById('progressNote').textContent = 'Could not reach server';
    }
  }
  loadBalance();
  setInterval(loadBalance, 8000);

  document.getElementById('claimForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const status = document.getElementById('status');
    const email = document.getElementById('email').value.trim();
    const emailConfirm = document.getElementById('emailConfirm').value.trim();
    const currentEmail = document.getElementById('currentEmail').value.trim();
    const mismatchNote = document.getElementById('emailMismatch');

    if (originalPayoutEmail && !email) {
      status.textContent = 'Already registered — enter a new email above only if you want to change it.';
      status.className = 'status err';
      return;
    }

    if (email.toLowerCase() !== emailConfirm.toLowerCase()) {
      mismatchNote.style.display = 'block';
      document.getElementById('emailConfirm').focus();
      return;
    }
    mismatchNote.style.display = 'none';

    if (originalPayoutEmail && originalPayoutEmail.toLowerCase() !== email.toLowerCase() && !currentEmail) {
      status.textContent = 'Enter the currently registered email above to confirm it\'s really you.';
      status.className = 'status err';
      document.getElementById('currentEmail').focus();
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Registering…';
    try {
      const body = { id, email };
      if (originalPayoutEmail && originalPayoutEmail.toLowerCase() !== email.toLowerCase()) {
        body.current_email = currentEmail;
      }
      const res = await fetch('https://deadtime-server.bean-picker.workers.dev/register-payout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'failed');

      flyOrbToBadge(btn);
      document.getElementById('destNote').textContent = email;
      document.getElementById('stepEmail').classList.add('done');
      document.getElementById('stepEmail').querySelector('.check').innerHTML = checkIcon;
      document.getElementById('successDetail').textContent = `Payouts go to ${email} once you cross $${THRESHOLD}.`;

      setTimeout(() => {
        document.getElementById('claimForm').classList.add('hidden');
        document.getElementById('successState').classList.add('show');
      }, 500);
    } catch (err) {
      status.textContent = 'Something went wrong — check the email and try again.';
      status.className = 'status err';
      btn.disabled = false;
      btn.textContent = 'Register for payout';
    }
  });
}

/* ---------- your node ----------
 * A quiet ring of the wider network, with one node marked as you --
 * bigger, gold, centered. Every time your real usage ticks up (checked
 * against /earnings on each poll), your node actually flares and sends
 * a pulse out into the network. This is your position in the system,
 * not a generic animation. */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const RING_COUNT = 24;
const you = { r: 3 };
const ring = Array.from({ length: RING_COUNT }, (_, i) => {
  const a = (i / RING_COUNT) * Math.PI * 2 + Math.random() * 0.25;
  const rad = Math.min(W, H) * (0.3 + Math.random() * 0.55);
  return { a, rad, r: 1 + Math.random() * 1.2, drift: (Math.random() - 0.5) * 0.0005 };
});
const pulses = [];

function spawnYourPulse() {
  const n = ring[Math.floor(Math.random() * ring.length)];
  pulses.push({ node: n, t0: performance.now(), dur: 950 });
}

function tick(t) {
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.32;

  const pts = ring.map(n => {
    n.a += n.drift;
    return { x: cx + Math.cos(n.a) * n.rad, y: cy + Math.sin(n.a) * n.rad, r: n.r };
  });

  for (const p of pts) {
    ctx.strokeStyle = 'rgba(232,200,150,0.04)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }

  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    const idx = ring.indexOf(p.node);
    const target = pts[idx] || pts[0];
    const progress = (t - p.t0) / p.dur;
    if (progress >= 1) { pulses.splice(i, 1); continue; }
    const ease = 1 - Math.pow(1 - Math.min(1, progress * 1.5), 3);
    const glow = Math.sin(Math.min(1, progress) * Math.PI);
    const x = cx + (target.x - cx) * ease, y = cy + (target.y - cy) * ease;
    ctx.strokeStyle = `rgba(242,177,52,${0.5 * glow})`;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, y, 1.5 + glow * 2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(242,177,52,${0.55 * glow})`;
    ctx.shadowBlur = 14 * glow;
    ctx.shadowColor = 'rgba(242,177,52,0.8)';
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  for (const p of pts) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(232,200,150,0.18)';
    ctx.fill();
  }

  const pulse = 1 + Math.sin(t / 600) * 0.15;
  ctx.beginPath();
  ctx.arc(cx, cy, you.r * pulse, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(242,177,52,0.7)';
  ctx.shadowBlur = 12;
  ctx.shadowColor = 'rgba(242,177,52,0.7)';
  ctx.fill();
  ctx.shadowBlur = 0;

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
setInterval(() => { if (Math.random() < 0.3) spawnYourPulse(); }, 5000);

/* ---------- giant interactive wordmark ---------- */
const megaWord = document.getElementById('megaWord');
if (megaWord) {
  const setMegaPos = (x, y) => {
    const r = megaWord.getBoundingClientRect();
    megaWord.style.setProperty('--mx', ((x - r.left) / r.width * 100) + '%');
    megaWord.style.setProperty('--my', ((y - r.top) / r.height * 100) + '%');
  };
  megaWord.addEventListener('mousemove', (e) => setMegaPos(e.clientX, e.clientY));
  megaWord.addEventListener('touchstart', (e) => {
    const t = e.touches[0]; if (!t) return;
    setMegaPos(t.clientX, t.clientY); megaWord.classList.add('touched');
  }, { passive: true });
  megaWord.addEventListener('touchmove', (e) => {
    const t = e.touches[0]; if (!t) return;
    setMegaPos(t.clientX, t.clientY); megaWord.classList.add('touched');
  }, { passive: true });
  megaWord.addEventListener('touchend', () => {
    setTimeout(() => megaWord.classList.remove('touched'), 900);
  });

  /* text-pressure: split into letters across all three layers, weight
     responds to cursor proximity using Fraunces' real variable wght axis */
  const megaLayers = megaWord.querySelectorAll('.mega-base, .mega-shine, .mega-glow');
  const megaLetters = [];
  megaLayers.forEach((layer, layerIdx) => {
    const letters = layer.textContent.split('');
    layer.innerHTML = letters.map((ch) => `<span class="ml">${ch === ' ' ? '&nbsp;' : ch}</span>`).join('');
    layer.querySelectorAll('.ml').forEach((span, i) => {
      if (layerIdx === 0) megaLetters.push([span]);
      else megaLetters[i].push(span);
    });
  });
  megaWord.addEventListener('mousemove', (e) => {
    megaLetters.forEach((spansAcrossLayers) => {
      const r = spansAcrossLayers[0].getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const dist = Math.abs(e.clientX - cx);
      const weight = Math.max(300, 900 - dist * 3.2);
      spansAcrossLayers.forEach((span) => span.style.setProperty('--w', weight.toFixed(0)));
    });
  });
  megaWord.addEventListener('mouseleave', () => {
    megaLetters.forEach((spansAcrossLayers) =>
      spansAcrossLayers.forEach((span) => span.style.removeProperty('--w'))
    );
  });
}
</script>

<script>
/* ---------- magnetic buttons -- nudge toward cursor within proximity ---------- */
document.querySelectorAll('.magnetic').forEach((el) => {
  el.addEventListener('mousemove', (e) => {
    const r = el.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2);
    const dy = e.clientY - (r.top + r.height / 2);
    el.style.transform = `translate(${dx * 0.25}px, ${dy * 0.25}px)`;
  });
  el.addEventListener('mouseleave', () => { el.style.transform = ''; });
});
</script>
