<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meanwhile — campaign dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --bg:#07070a; --panel:rgba(255,255,255,0.045); --panel-2:rgba(255,255,255,0.07); --border:rgba(255,255,255,0.1);
    --text:#f5f0e6; --muted:#8c8c96; --green:#7ee787; --amber:#e0b054; --red:#e5697a;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:radial-gradient(ellipse 60% 35% at 50% -5%, rgba(232,200,150,.09), transparent),
         radial-gradient(ellipse 50% 30% at 90% 20%, rgba(168,85,247,.06), transparent), var(--bg);
         color:var(--text); font-family:'Inter',-apple-system,sans-serif;
         -webkit-font-smoothing:antialiased; min-height:100vh; }
  .wrap { max-width:520px; margin:0 auto; padding:56px 24px 80px; }

  .brand { display:flex; align-items:center; gap:10px; margin-bottom:36px; }
  .brand img { width:28px; height:28px; }
  .brand span { font-family:'Fraunces',serif; font-size:16px; font-weight:600; }

  h1 { font-family:'Fraunces',serif; font-size:27px; font-weight:600; margin-bottom:8px; letter-spacing:-0.01em;
       background:linear-gradient(100deg,#a855f7,#3b82f6,#14c9a5,#f2b134,#f0654a,#ec4899,#a855f7);
       background-size:180% auto; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
       animation:shimmer 8s linear infinite; }
  @keyframes shimmer { to { background-position:180% center; } }
  .sub { color:var(--muted); font-size:14px; margin-bottom:28px; }

  .status-badge { display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600;
                   padding:7px 14px; border-radius:100px; margin-bottom:24px; }
  .status-badge.pending { color:var(--amber); background:rgba(224,176,84,.1); border:1px solid rgba(224,176,84,.3); }
  .status-badge.active { color:var(--green); background:rgba(126,231,135,.1); border:1px solid rgba(126,231,135,.3); }
  .status-badge.exhausted { color:var(--muted); background:var(--panel); border:1px solid var(--border); }
  .status-badge .dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
  .status-badge.active .dot { box-shadow:0 0 10px currentColor; animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:22px 24px; margin-bottom:20px; }
  .card-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  .card-value { font-size:16px; font-weight:600; }
  .card-value.mono { font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--muted); word-break:break-all; }

  .progress-card { background:linear-gradient(180deg, var(--panel-2), var(--panel)); border:1px solid var(--border);
                    border-radius:14px; padding:24px; margin-bottom:20px; }
  .progress-numbers { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  .progress-numbers .delivered { font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:800; }
  .progress-numbers .total { font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--muted); }
  .progress-track { height:8px; background:var(--border); border-radius:100px; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg,#f2b134,#ec4899,#a855f7); border-radius:100px; transition:width .8s cubic-bezier(.16,1,.3,1); }
  .progress-note { font-size:12px; color:var(--muted); margin-top:10px; }

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px; }

  .no-id { text-align:center; color:var(--muted); font-size:14px; padding:60px 20px; }
  .no-id code { background:var(--panel); padding:3px 7px; border-radius:5px; border:1px solid var(--border); }
  .refresh-note { font-size:11px; color:var(--muted); text-align:center; margin-top:20px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="logo-192.png" alt=""><span>Meanwhile</span></div>
  <div id="app"><div class="no-id">Loading…</div></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const id = params.get('id');
const app = document.getElementById('app');

const STATUS_LABEL = {
  pending_payment: 'Awaiting payment',
  active: 'Live and delivering',
  exhausted: 'Budget fully delivered',
};

function render(c) {
  const pct = c.impressions_total ? Math.min(100, (c.impressions_delivered / c.impressions_total) * 100) : 0;
  app.innerHTML = `
    <div class="status-badge ${c.status === 'pending_payment' ? 'pending' : c.status}">
      <span class="dot"></span> ${STATUS_LABEL[c.status] || c.status}
    </div>
    <h1>${c.company}</h1>
    <p class="sub">Campaign ID: <span style="font-family:'JetBrains Mono',monospace">${c.id}</span></p>

    <div class="progress-card">
      <div class="progress-numbers">
        <span class="delivered">${c.impressions_delivered.toLocaleString()}</span>
        <span class="total">of ${c.impressions_total.toLocaleString()} impressions</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-note">${
        c.status === 'pending_payment' ? 'Delivery starts the moment payment clears.' :
        c.status === 'exhausted' ? 'This campaign has fully delivered its purchased impressions.' :
        `${(c.impressions_total - c.impressions_delivered).toLocaleString()} impressions remaining`
      }</div>
    </div>

    <div class="grid">
      <div class="card"><div class="card-label">Blocks purchased</div><div class="card-value">${c.blocks}</div></div>
      <div class="card"><div class="card-label">Amount</div><div class="card-value">$${c.price_usd.toFixed(2)}</div></div>
    </div>

    <div class="card">
      <div class="card-label">Your line</div>
      <div class="card-value">${c.line}</div>
    </div>
    <div class="card">
      <div class="card-label">Destination</div>
      <div class="card-value mono">${c.url}</div>
    </div>

    <div class="refresh-note">This page updates automatically every 15 seconds.</div>
  `;
}

async function load() {
  try {
    const res = await fetch(`https://deadtime-server.bean-picker.workers.dev/campaign-status?id=${id}`);
    if (!res.ok) throw new Error('not found');
    const c = await res.json();
    render(c);
  } catch (e) {
    app.innerHTML = `<div class="no-id">No campaign found for this ID.</div>`;
  }
}

if (!id) {
  app.innerHTML = `<div class="no-id">No campaign ID in the link. Use the link shown after you submit an ad on the <a href="advertiser.html" style="color:inherit">advertiser page</a>.</div>`;
} else {
  load();
  setInterval(load, 15000);
}
</script>
</body>
</html>
